name: Release

# Publishes the version in package.json to the VS Code Marketplace and Open VSX, and creates the GitHub release.
# Secrets of the `release` environment: VSCE_PAT (Azure DevOps token with Marketplace > Manage), OVSX_PAT (Open VSX access token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pre-release:
        description: Publish as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    env:
      PRE_RELEASE: ${{ inputs.pre-release && '--pre-release' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npx vsce package $PRE_RELEASE -o preview-vscode.vsix
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish $PRE_RELEASE --packagePath preview-vscode.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # ovsx takes the pre-release flag from the package
        run: npx ovsx publish preview-vscode.vsix -p "$OVSX_PAT"
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          mv preview-vscode.vsix "preview-vscode-$version.vsix"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "preview-vscode-$version.vsix"
