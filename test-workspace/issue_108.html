<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="issue_108.css">
</head>

<body>
    <!-- Scripts only run when the preview security is "Disable" (Markdown: Change Preview Security Settings). -->
    <div class="static-gradient"></div>
    <div class="gradient-animation"></div>
    <p class="status" id="issue-108-status">Scripts did not run, the gradient doesn't follow the mouse.</p>
    <script>
        document.getElementById('issue-108-status').textContent = 'Scripts ran, move the mouse: the orange gradient follows it.';
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
</body>

</html>
